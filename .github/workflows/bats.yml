name: BATS Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  bats:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install BATS
        run: brew install bats-core
      - name: Run tests
        run: bats tests
