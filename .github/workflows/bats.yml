name: Bats tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install bats-core
      - name: Run bats tests
        run: bats test.bats
